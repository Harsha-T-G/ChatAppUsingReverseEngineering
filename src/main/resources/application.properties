spring.application.name=MiniChat
server.port=8090

# Postgres from docker-compose.yml
spring.datasource.url=jdbc:postgresql://localhost:5440/minichat
spring.datasource.username=minichat
spring.datasource.password=minichat

# Flyway owns the schema; Hibernate only checks that entities match it
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# The recorded API uses snake_case field names (channel_id, create_at, ...)
spring.jackson.property-naming-strategy=SNAKE_CASE

springdoc.swagger-ui.path=/swagger-ui.html
