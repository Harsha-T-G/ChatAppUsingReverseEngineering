services:
  db:
    image: postgres:16-alpine
    container_name: rea-mini-chat-db
    environment:
      POSTGRES_DB: minichat
      POSTGRES_USER: minichat
      POSTGRES_PASSWORD: minichat
    ports:
      - "5440:5432"
    volumes:
      - minichat-data:/var/lib/postgresql/data

volumes:
  minichat-data:
